services:
  - type: web
    name: globalsupply-api
    env: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MFA_JWT_SECRET
        sync: false
      - key: RESET_TOKEN_SECRET
        sync: false
      - key: API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: PLATFORM_OWNER_EMAIL
        value: owner@globalsupply.in
      - key: CORS_ALLOWED_ORIGINS
        value: https://globalsupply.in,https://app.globalsupply.in
      - key: FRONTEND_URL
        value: https://app.globalsupply.in
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: GlobalSupply Techno
      - key: SMTP_FROM
        value: noreply@globalsupply.in
      - key: FLIPKART_WEBHOOK_SECRET
        sync: false
      - key: NYKAA_WEBHOOK_SECRET
        sync: false
      - key: MYNTRA_WEBHOOK_SECRET
        sync: false
      - key: TATACLIQ_WEBHOOK_SECRET
        sync: false
      - key: AMAZON_WEBHOOK_SECRET
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: BACKUP_S3_BUCKET
        value: globalsupply-backups
      - key: BACKUP_RESTORE_TOKEN
        sync: false
      - key: BACKUP_KEEP_COUNT
        value: "14"

  - type: cron
    name: daily-s3-backup
    env: node
    region: singapore
    plan: free
    schedule: "0 2 * * *"
    rootDir: backend
    buildCommand: npm install
    startCommand: node scripts/backup-cron.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BACKUP_S3_BUCKET
        value: globalsupply-backups
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
